name: 🛡️ Fetch Patch Tuesday Data

on:
  # 2nd Tuesday of every month at 20:00 UTC (1:30 AM IST next day)
  # Patch Tuesday is always 2nd Tuesday — Microsoft releases ~17:00 UTC
  schedule:
    - cron: "0 20 8-14 * 2"  # Day 8-14, Tuesday, at 20:00 UTC
  workflow_dispatch:

jobs:
  fetch-patches:
    name: Fetch Latest Windows 11 Patch Data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: 🛡️ Fetch patch data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_patches.py

      - name: 💾 Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "🛡️ Patch Tuesday data updated [$(date +'%Y-%m-%d')]"
          git push
