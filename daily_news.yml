name: 📰 Daily Patch News Fetch

on:
  # Runs every day at 10:00 UTC (3:30 PM IST)
  # Script auto-detects if within 7-day window and exits if not
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  fetch-news:
    name: Fetch Windows Patch News Articles
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: 🔄 Update meta.json (days counter)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_patches.py

      - name: 📰 Fetch latest news articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_articles.py

      - name: 💾 Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "📰 Daily news update [$(date +'%Y-%m-%d')]"
          git push
